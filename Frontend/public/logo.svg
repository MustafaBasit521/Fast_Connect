<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <style>
      .icon-stroke { fill: none; stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-node { fill: #ffffff; stroke: #1e293b; stroke-width: 2.5; }
      .text-fast { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 700; fill: #0f172a; font-size: 26px; letter-spacing: 0.5px; }
      .text-connect { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 400; fill: #334155; font-size: 26px; }
    </style>
  </defs>

  <!-- Logo Mark (Network Shield 'C') -->
  <g transform="translate(10, 5)">
    <!-- Main Shield / 'C' Contour -->
    <path class="icon-stroke" d="M 42,18 C 30,18 22,26 22,38 C 22,54 36,64 42,68 C 48,64 50,58 50,54" />
    <path class="icon-stroke" d="M 40,28 C 32,28 29,33 29,40 C 29,50 38,57 42,59" />

    <!-- Network Lines & Nodes -->
    <!-- Top Left -->
    <line class="icon-stroke" x1="28" y1="23" x2="18" y2="15" />
    <circle class="icon-node" cx="18" cy="15" r="4" />

    <!-- Top Center -->
    <line class="icon-stroke" x1="42" y1="18" x2="42" y2="8" />
    <circle class="icon-node" cx="42" cy="8" r="4" />

    <!-- Top Right -->
    <line class="icon-stroke" x1="52" y1="24" x2="60" y2="16" />
    <circle class="icon-node" cx="60" cy="16" r="4" />

    <!-- Middle Left -->
    <line class="icon-stroke" x1="22" y1="38" x2="10" y2="38" />
    <circle class="icon-node" cx="10" cy="38" r="4" />

    <!-- Bottom Left -->
    <line class="icon-stroke" x1="26" y1="52" x2="16" y2="60" />
    <circle class="icon-node" cx="16" cy="60" r="4" />
  </g>

  <!-- Typography -->
  <text x="85" y="48">
    <tspan class="text-fast">FAST </tspan>
    <tspan class="text-connect">Connect</tspan>
  </text>
</svg>
